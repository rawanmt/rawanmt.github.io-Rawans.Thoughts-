
baseURL: "https://rawanmt.github.io/"
languageCode: en-us
title: "Rawan's Thoughts"
theme: ["PaperMod"]

enableRobotsTXT: true

params:
  env: production
  description: "Cybersecurity research, notes, and insights"
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  homeInfoParams:
    Title: "Welcome to my blog"
    Content: "Exploring cybersecurity, threat detection, digital forensics, and research."

  socialIcons:
    - name: github
      url: "https://github.com/YOUR_USERNAME"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Tags
      url: /tags/
      weight: 20
